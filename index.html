<meta charset="utf-8">

<title>زمانه · Zamaneh — Clocks & Decor</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;600;700&family=Vazirmatn:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#081224;--bg2:#0d1b34;--panel:#12223f;--line:rgba(232,197,138,.18);--gold:#c9964f;--gold2:#ecd0a0;--cream:#f5eee2;--ink:#e9eef8;--mut:#9aa8c2;--paper:#f5eee2;--pink:#1a2b4d;--r:16px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:'Vazirmatn',system-ui,sans-serif;line-height:1.7;padding-bottom:78px;overflow-x:hidden}
h1,h2,h3,.disp{font-family:'Reem Kufi','Vazirmatn',sans-serif;font-weight:600;line-height:1.3}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
.wrap{max-width:1240px;margin:0 auto;padding:0 18px}
/* header */
header{position:sticky;top:0;z-index:40;background:rgba(8,18,36,.82);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.hd{display:flex;align-items:center;justify-content:space-between;height:62px;gap:10px}
.logo{display:flex;align-items:center;gap:9px;font-family:'Reem Kufi';font-size:23px;color:var(--gold2)}
.logo svg{width:28px;height:28px}
.dnav{display:none;gap:22px;font-size:15px;color:var(--mut)}
.dnav a:hover{color:var(--gold2)}
.hdr-r{display:flex;align-items:center;gap:8px}
.lang{display:flex;border:1px solid var(--line);border-radius:99px;overflow:hidden;font-size:12.5px}
.lang button{padding:5px 10px;color:var(--mut)} .lang button.on{background:var(--gold);color:#1a1205;font-weight:700}
.ic{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;position:relative;border:1px solid var(--line)}
.ic svg{width:20px;height:20px;stroke:var(--gold2);fill:none;stroke-width:1.7}
.badge{position:absolute;top:-4px;inset-inline-end:-4px;background:var(--gold);color:#1a1205;font-size:11px;font-weight:700;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 4px}
@media(min-width:900px){.dnav{display:flex}}
/* hero */
.hero{position:relative;overflow:hidden;padding:34px 0 40px;background:radial-gradient(1000px 520px at 50% 18%,#1a2f58 0%,#0b162c 55%,#081224 100%)}
.bigclock{position:absolute;inset-inline:0;top:-120px;margin:auto;width:760px;max-width:140vw;opacity:.14;pointer-events:none}
.hero h1{font-size:clamp(28px,5.4vw,52px);text-align:center;color:#fff;margin:8px 0 8px;position:relative}
.hero h1 em{font-style:normal;color:var(--gold2)}
.hero p.sub{text-align:center;color:var(--mut);max-width:600px;margin:0 auto 6px;position:relative;font-size:15px}
.flow{position:relative;height:min(62vw,380px);min-height:290px;perspective:1100px;margin:26px auto 8px;max-width:980px;touch-action:pan-y;user-select:none}
.fc{position:absolute;top:0;left:50%;width:min(52vw,250px);height:100%;margin-left:calc(min(52vw,250px)/-2);border-radius:22px;overflow:hidden;cursor:pointer;
 background:linear-gradient(160deg,rgba(255,255,255,.14),rgba(255,255,255,.04));border:1px solid rgba(236,208,160,.28);box-shadow:0 24px 50px rgba(0,0,0,.5);transition:transform .7s cubic-bezier(.2,.8,.2,1),opacity .6s,filter .6s}
.fc img{width:100%;height:76%;object-fit:cover;background:#0d1b34}
.fc .cap{position:absolute;inset:auto 0 0 0;height:24%;display:flex;flex-direction:column;justify-content:center;align-items:center;background:linear-gradient(180deg,rgba(8,18,36,.1),rgba(8,18,36,.85));backdrop-filter:blur(8px)}
.fc .cap b{font-family:'Reem Kufi';font-size:18px;color:var(--gold2)} .fc .cap span{font-size:12px;color:var(--mut)}
.fdots{display:flex;gap:7px;justify-content:center;margin-top:14px;position:relative}
.fdots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.25);transition:.3s} .fdots i.on{width:22px;border-radius:5px;background:var(--gold)}
.cta{display:flex;gap:10px;justify-content:center;margin-top:20px;position:relative;flex-wrap:wrap}
.btn{padding:12px 26px;border-radius:99px;font-weight:700;font-size:15px;transition:.25s}
.btn.g{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#1a1205} .btn.g:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(201,150,79,.35)}
.btn.o{border:1px solid var(--gold);color:var(--gold2)} .btn.o:hover{background:rgba(201,150,79,.12)}
/* cats */
.cats{display:flex;gap:10px;overflow-x:auto;padding:22px 18px 6px;scrollbar-width:none;max-width:1240px;margin:0 auto}
.cats::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 18px;border-radius:99px;border:1px solid var(--line);color:var(--mut);font-size:14px;transition:.2s}
.chip.on{background:var(--gold);color:#1a1205;border-color:var(--gold);font-weight:700}
/* sections */
section{padding:44px 0}
.sh{display:flex;align-items:end;justify-content:space-between;margin-bottom:20px;gap:10px}
.sh h2{font-size:clamp(22px,3.4vw,32px);color:var(--gold2)}
.sh small{color:var(--mut)}
.light{background:var(--paper);color:#1a2236}
.light .sh h2{color:#7a4f1c} .light .card{background:#fff;border-color:#e9dcc3} .light .card .nm{color:#1a2236} .light .card .br{color:#8a7a5c}
.row{display:flex;gap:16px;overflow-x:auto;padding:4px 18px 14px;scroll-snap-type:x mandatory;scrollbar-width:thin}
.row .card{flex:none;width:min(66vw,240px);scroll-snap-align:start}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
@media(min-width:700px){.grid{grid-template-columns:repeat(3,1fr);gap:18px}}
@media(min-width:1000px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;transition:.3s;cursor:pointer;position:relative}
.card:hover{transform:translateY(-4px);box-shadow:0 18px 40px rgba(0,0,0,.35)}
.card .im{aspect-ratio:1;background:#eee7da;position:relative;overflow:hidden}
.card .im img{width:100%;height:100%;object-fit:cover;transition:.5s} .card:hover .im img{transform:scale(1.06)}
.card .im img.b{position:absolute;inset:0;opacity:0} .card:hover .im img.b{opacity:1}
.tag{position:absolute;top:10px;inset-inline-start:10px;background:var(--gold);color:#1a1205;font-size:11.5px;font-weight:700;padding:2px 10px;border-radius:99px;z-index:2}
.card .bd{padding:12px 14px 14px;display:flex;flex-direction:column;gap:3px;flex:1}
.card .br{font-size:12px;color:var(--mut);letter-spacing:.04em}
.card .nm{font-size:14.5px;line-height:1.55;color:#f1f4fb;min-height:45px}
.pr{display:flex;align-items:baseline;gap:8px;margin-top:auto;padding-top:8px}
.pr b{font-family:'Vazirmatn';font-weight:700;font-size:17px;color:var(--gold2)} .light .pr b{color:#8a5a1d}
.pr s{font-size:12.5px;color:var(--mut)}
.add{margin-top:10px;padding:9px;border-radius:12px;border:1px solid var(--gold);color:var(--gold2);font-size:14px;font-weight:500;transition:.2s}
.add:hover{background:var(--gold);color:#1a1205} .light .add{color:#7a4f1c}
/* offer */
.offer{display:grid;gap:22px;align-items:center;background:linear-gradient(135deg,#13264a,#0b162c);border:1px solid var(--line);border-radius:26px;padding:22px;overflow:hidden}
@media(min-width:800px){.offer{grid-template-columns:1fr 1fr;padding:34px}}
.offer img{border-radius:18px;width:100%;aspect-ratio:1;object-fit:cover}
.offer h3{font-size:clamp(22px,3vw,30px);color:#fff;margin:6px 0}
.pct{display:inline-block;background:var(--gold);color:#1a1205;font-weight:700;padding:3px 14px;border-radius:99px}
/* toolbar */
.tb{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.tb input,.tb select{background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:12px;padding:10px 14px;font:inherit;outline:none;flex:1;min-width:140px}
.tb input:focus,.tb select:focus{border-color:var(--gold)}
.more{display:block;margin:26px auto 0}
/* why */
.why{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
@media(min-width:900px){.why{grid-template-columns:repeat(4,1fr)}}
.why div{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:20px 16px;text-align:center}
.why svg{width:34px;height:34px;stroke:var(--gold);fill:none;stroke-width:1.5;margin:0 auto 8px}
.why b{display:block;font-family:'Reem Kufi';font-size:17px;color:var(--gold2)} .why span{font-size:13px;color:var(--mut)}
/* footer */
footer{background:#050c19;border-top:1px solid var(--line);padding:34px 0 20px;color:var(--mut);font-size:14px}
.fg{display:grid;gap:22px;grid-template-columns:1fr} @media(min-width:800px){.fg{grid-template-columns:1.4fr 1fr 1fr}}
footer h4{font-family:'Reem Kufi';color:var(--gold2);margin-bottom:8px;font-size:17px}
footer a{display:block;padding:2px 0} footer a:hover{color:var(--gold2)}
.copy{margin-top:22px;padding-top:14px;border-top:1px solid var(--line);text-align:center;font-size:12.5px}
/* bottom nav */
.bn{position:fixed;inset:auto 0 0 0;z-index:45;background:rgba(8,18,36,.94);backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.bn a,.bn button{display:flex;flex-direction:column;align-items:center;gap:1px;font-size:11.5px;color:var(--mut);padding:4px 10px;position:relative}
.bn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.6}
.bn .mid{margin-top:-24px;background:linear-gradient(135deg,var(--gold2),var(--gold));color:#1a1205;width:58px;height:58px;border-radius:50%;justify-content:center;box-shadow:0 8px 20px rgba(201,150,79,.4);border:4px solid var(--bg)}
.bn .badge{top:-2px;inset-inline-end:-2px}
@media(min-width:900px){.bn{display:none}body{padding-bottom:0}}
/* modal + drawer */
.ov{position:fixed;inset:0;background:rgba(2,6,14,.72);z-index:60;display:none;backdrop-filter:blur(4px)}
.ov.on{display:block}
.modal{position:fixed;z-index:61;inset:auto 0 0 0;max-height:92vh;overflow:auto;background:var(--bg2);border-radius:26px 26px 0 0;border:1px solid var(--line);padding:18px;display:none}
.modal.on{display:block;animation:up .35s}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@media(min-width:800px){.modal{inset:50% auto auto 50%;transform:translate(-50%,-50%);width:min(900px,92vw);border-radius:26px}.modal.on{animation:none}}
.mg{display:grid;gap:18px} @media(min-width:800px){.mg{grid-template-columns:1fr 1fr}}
.gal img.main{width:100%;aspect-ratio:1;object-fit:cover;border-radius:18px;background:#eee7da}
.th{display:flex;gap:8px;margin-top:8px} .th img{width:62px;height:62px;object-fit:cover;border-radius:10px;border:2px solid transparent;cursor:pointer;opacity:.7} .th img.on{border-color:var(--gold);opacity:1}
.x{position:absolute;top:12px;inset-inline-end:14px;font-size:24px;color:#fff;z-index:3;width:36px;height:36px;border-radius:50%;background:rgba(8,18,36,.7);line-height:1}
.mi h3{font-size:22px;color:#fff} .mi .pr b{font-size:26px}
.spec{margin:14px 0;border-top:1px solid var(--line)} .spec div{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px} .spec span{color:var(--mut)}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:99px;overflow:hidden} .qty button{width:38px;height:38px;font-size:20px} .qty b{min-width:30px;text-align:center}
.drawer{position:fixed;z-index:61;top:0;bottom:0;inset-inline-start:auto;inset-inline-end:0;width:min(420px,100vw);background:var(--bg2);border-inline-start:1px solid var(--line);transform:translateX(110%);transition:.35s;display:flex;flex-direction:column}
[dir=rtl] .drawer{transform:translateX(-110%);inset-inline-end:auto;inset-inline-start:0;right:auto;left:0}
.drawer.on{transform:none}
.dh{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line)} .dh h3{color:var(--gold2)}
.db{flex:1;overflow:auto;padding:12px 18px}
.ci{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)} .ci img{width:64px;height:64px;border-radius:10px;object-fit:cover;background:#eee7da}
.ci .t{flex:1;font-size:13.5px} .ci .t b{display:block;color:var(--gold2)}
.df{padding:14px 18px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line);display:grid;gap:8px}
.df input{background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:12px;padding:10px 14px;font:inherit;outline:none}
.tot{display:flex;justify-content:space-between;font-size:16px} .tot b{color:var(--gold2);font-size:19px}
.wa{background:#1fa855;color:#fff;border-radius:99px;padding:13px;font-weight:700;text-align:center}
.toast{position:fixed;z-index:70;inset:18px 0 auto 0;margin:auto;width:max-content;max-width:90vw;background:var(--gold);color:#1a1205;padding:10px 20px;border-radius:99px;font-weight:700;transform:translateY(-90px);transition:.35s}
.toast.on{transform:none}
.empty{color:var(--mut);text-align:center;padding:30px 0}
</style>
</head>

 buildCats();buildFlow();render();rows();offer();cartUI();closeAll()}
const CATS=['all','wall','table','art','mirror','wood','metal','gear'];
function filt(){const q=$('#q').value.trim().toLowerCase();let a=ITEMS.filter(p=>cat==='all'||p.t===cat||p.m===cat);if(q)a=a.filter(p=>(p.fa+p.ar+p.en+p.code+p.br).toLowerCase().includes(q));
 const s=$('#sort').value;if(s==='1')a=[...a].sort((x,y)=>x.p-y.p);if(s==='2')a=[...a].sort((x,y)=>y.p-x.p);return a}
function card(p){const off=p.r>p.p?Math.round((1-p.p/p.r)*100):0;return `<div class="card" data-id="${p.id}">${off?`<span class="tag">${off}% ${t('off')}</span>`:p.new?`<span class="tag">NEW</span>`:''}<div class="im">${IM(p.im[0])}${p.im[1]?IM(p.im[1],'b'):''}</div><div class="bd"><span class="br">${p.br} · ${p.code}</span><div class="nm">${nm(p)}</div><div class="pr"><b>${price(p.p)}</b>${off?`<s>${price(p.r)}</s>`:''}</div><button class="add" data-add="${p.id}">${t('add')}</button></div></div>`}
function render(){const a=filt();$('#count').textContent=a.length+' '+t('items');$('#grid').innerHTML=a.slice(0,shown).map(card).join('')||`<p class="empty">—</p>`;$('#more').style.display=a.length>shown?'block':'none'}

function offer(){const p=ITEMS.find(x=>x.r>x.p);if(!p){$('#offerBox').innerHTML='';return}const off=Math.round((1-p.p/p.r)*100);
 $('#offerBox').innerHTML=`<div class="offer"><div class="im2">${IM(p.im[0])}</div><div><span class="pct">${t('offer_k')} · ${off}% ${t('off')}</span><h3>${nm(p)}</h3><p style="color:var(--mut)">${p.d}</p><div class="pr" style="margin:12px 0"><b style="font-size:28px">${price(p.p)}</b><s>${price(p.r)}</s></div><button class="btn g" data-open="${p.id}">${t('buy')}</button></div></div>`}

 $('#fdots').innerHTML=FL.map((_,i)=>`<i data-i="${i}"></i>`).join('');place()}
function place(){$$('.fc').forEach((e,i)=>{let o=i-fi;const n=FL.length;if(o>n/2)o-=n;if(o<-n/2)o+=n;const a=Math.abs(o),rtl=document.documentElement.dir==='rtl'?-1:1;
 e.style.transform=`translateX(${o*rtl*58}%) translateZ(${-a*140}px) rotateY(${-o*rtl*38}deg) scale(${1-a*.06})`;e.style.opacity=a>2?0:1-a*.25;e.style.zIndex=10-a;e.style.filter=a?'brightness(.6)':'none';e.style.pointerEvents=a>2?'none':'auto'});
 $$('#fdots i').forEach((d,i)=>d.classList.toggle('on',i===fi))}

 $('#modal').innerHTML=`<button class="x" data-close>×</button><div class="mg"><div class="gal"><img class="main" id="mainimg" src="${img(p.im[0])}" referrerpolicy="no-referrer"><div class="th">${p.im.map((u,i)=>`<img class="${i?'':'on'}" src="${img(u)}" referrerpolicy="no-referrer" data-th="${i}">`).join('')}</div></div><div class="mi"><h3>${nm(p)}</h3><div class="pr"><b>${price(p.p)}</b>${p.r>p.p?`<s>${price(p.r)}</s>`:''}</div><p style="color:var(--mut);margin:8px 0">${p.d}</p><div class="spec">${sp.map(r=>`<div><span>${r[0]}</span><b>${r[1]}</b></div>`).join('')}</div><button class="btn g" style="width:100%" data-add="${p.id}" data-keep>${t('add')}</button></div></div>`;
 $('#modal').dataset.id=id;$('#ov').classList.add('on');$('#modal').classList.add('on')}
document.addEventListener('click',e=>{const T=e.target;let x;

$('#q').oninput=()=>{shown=12;render()};$('#sort').onchange=()=>{shown=12;render()};$('#cn').oninput=$('#ca').oninput=cartUI;
let sx=null;const fl=$('#flow');fl.addEventListener('pointerdown',e=>sx=e.clientX);fl.addEventListener('pointerup',e=>{if(sx===null)return;const d=e.clientX-sx;sx=null;if(Math.abs(d)>40){const r=document.documentElement.dir==='rtl'?-1:1;fi=(fi+(d>0?-1:1)*r*-1+FL.length)%FL.length;place();play()}});

(()=>{let s='';for(let i=0;i<60;i++){const a=i*6*Math.PI/180,r1=i%5?91:86,r2=94;s+=`<line x1="${100+Math.sin(a)*r1}" y1="${100-Math.cos(a)*r1}" x2="${100+Math.sin(a)*r2}" y2="${100-Math.cos(a)*r2}"/>`}$('#ticks').innerHTML=s;
 const tick=()=>{const d=new Date,S=d.getSeconds()+d.getMilliseconds()/1000,M=d.getMinutes()+S/60,H=d.getHours()%12+M/60;$('#ss').setAttribute('transform',`rotate(${S*6} 100 100)`);$('#mm').setAttribute('transform',`rotate(${M*6} 100 100)`);$('#hh').setAttribute('transform',`rotate(${H*30} 100 100)`);requestAnimationFrame(tick)};tick()})();
